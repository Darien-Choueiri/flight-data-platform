services:

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      # is Kafka's port open? (cheap: asking kafka-topics.sh instead starts a whole Java program every 5 s)
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  spark:
    build: .
    volumes:
      - ./:/app
    working_dir: /app
    mem_limit: 4g
    # --driver-memory is what actually gives Spark its memory (the default is only 1g)
    command: /opt/spark/bin/spark-submit --driver-memory 2g team_project.py

  producer:
    build:
      context: .
      dockerfile: stream.Dockerfile
    volumes:
      - ./:/app
    depends_on:
      kafka:
        condition: service_healthy
      spark:
        condition: service_completed_successfully
    command: python producer.py
    stop_signal: SIGINT
    environment:
      PYTHONUNBUFFERED: 1
      PARQUET_FILES: "parquet_monthly/*.parquet"
      SPEEDUP: 432000

  consumer:
    build:
      context: .
      dockerfile: stream.Dockerfile
    volumes:
      - ./:/app
    depends_on:
      kafka:
        condition: service_healthy
    command: python consumer.py
    stop_signal: SIGINT
    stop_grace_period: 1m  # time to save the tally after Ctrl+C
    environment:
      PYTHONUNBUFFERED: 1
