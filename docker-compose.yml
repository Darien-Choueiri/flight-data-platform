x-flight-db: &flight-db
  PGHOST: postgres
  PGUSER: flight_user
  PGDATABASE: flight_data_platform
  PGPASSWORD: flight_password

services:

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  spark:
    build: .
    depends_on:
      stream-schema:
        condition: service_completed_successfully
    environment: *flight-db
    volumes:
      - ./:/app
    working_dir: /app
    mem_limit: 4g
    command:
      - /bin/sh
      - -ec
      - |
        /opt/spark/bin/spark-submit team_project.py
        /opt/spark/bin/spark-submit --driver-memory 2g /app/serving.py export

  stream-schema:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment: *flight-db
    volumes:
      - ./database/init.sql:/schema.sql:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/schema.sql"]

  producer:
    build:
      context: .
      dockerfile: stream.Dockerfile
    volumes:
      - ./:/app
    depends_on:
      stream-schema:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      spark:
        condition: service_completed_successfully
    command: python producer.py
    stop_signal: SIGINT
    environment:
      <<: *flight-db
      PYTHONUNBUFFERED: 1
      PARQUET_FILES: "parquet_monthly/*.parquet"
      SPEEDUP: 86400

  consumer:
    build:
      context: .
      dockerfile: stream.Dockerfile
    volumes:
      - ./:/app
    depends_on:
      stream-schema:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    command: python consumer.py
    stop_signal: SIGINT
    environment:
      <<: *flight-db
      PYTHONUNBUFFERED: 1

  postgres:
    image: postgres:17
    command: ["postgres", "-c", "max_wal_size=2GB"]
    environment:
      POSTGRES_DB: flight_data_platform
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_password
    volumes:
      - flight_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "flight_user", "-d", "flight_data_platform"]
      interval: 5s
      timeout: 3s
      retries: 12
  
  benchmark:
    build:
      context: ./database
      dockerfile: benchmark.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      producer:
        condition: service_completed_successfully
      consumer:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: flight_password
    volumes:
      - ./:/app:ro
    command: ["python3", "/app/serving.py", "benchmark"]

volumes:
  flight_postgres_data:
